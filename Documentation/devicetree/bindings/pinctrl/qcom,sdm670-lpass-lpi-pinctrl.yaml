%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/qcom,sdm670-lpass-lpi-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SDM670 SoC LPASS LPI TLMM

maintainers:
  - Richard Acayan <mailingradian@gmail.com>
    # Maybe?
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description:
  Top Level Mode Multiplexer pin controller in the Low Power Audio SubSystem
  (LPASS) Low Power Island (LPI) of Qualcomm SDM670 SoC.

properties:
  compatible:
    const: qcom,sdm670-lpass-lpi-pinctrl

  reg:
    items:
      - description: LPASS LPI TLMM Control and Status registers

  qcom,adsp-bypass-mode: true

patternProperties:
  "-state$":
    oneOf:
      - $ref: "#/$defs/qcom-sdm670-lpass-state"
      - patternProperties:
          "-pins$":
            $ref: "#/$defs/qcom-sdm670-lpass-state"
        additionalProperties: false

$defs:
  qcom-sdm670-lpass-state:
    type: object
    description:
      Pinctrl node's client devices use subnodes for desired pin configuration.
      Client device subnodes use below standard properties.
    $ref: qcom,lpass-lpi-common.yaml#/$defs/qcom-tlmm-state
    unevaluatedProperties: false

    properties:
      pins:
        description:
          List of gpio pins affected by the properties specified in this
          subnode.
        items:
          pattern: "^gpio([0-9]|1[0-9]|2[0-6])$"

      function:
        enum: [ gpio, comp_rx, dmic12, dmic34, lpi_cdc_rst, mclk0, pdm_2_gpios,
                pdm_clk, pdm_rx, pdm_sync, sec_tdm, sec_tdm_din, sec_tdm_dout ]
        description:
          Specify the alternative function to be configured for the specified
          pins.

allOf:
  - $ref: qcom,lpass-lpi-common.yaml#

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    lpi_tlmm: pinctrl@62b40000 {
        compatible = "qcom,sdm670-lpass-lpi-pinctrl";
        reg = <0 0x62b40000 0 0x20000>;
        qcom,adsp-bypass-mode;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&lpi_tlmm 0 0 32>;
    };
